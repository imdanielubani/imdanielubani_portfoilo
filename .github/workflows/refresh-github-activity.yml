name: Refresh GitHub activity

# Rebuilds the contribution graph on the live portfolio as soon as code is pushed.
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   PORTFOLIO_SITE_URL         e.g. https://imdanielubani.com
#   PORTFOLIO_REVALIDATE_SECRET the same value as REVALIDATE_SECRET on the web app
# Until both exist the job exits successfully without doing anything.

on:
  push:
  workflow_dispatch:
  schedule:
    # Safety net for activity in other repositories.
    - cron: '*/15 * * * *'
  workflow_call:
    secrets:
      PORTFOLIO_SITE_URL:
        required: false
      PORTFOLIO_REVALIDATE_SECRET:
        required: false

permissions: {}

concurrency:
  group: refresh-github-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SITE_URL: ${{ secrets.PORTFOLIO_SITE_URL }}
      REVALIDATE_SECRET: ${{ secrets.PORTFOLIO_REVALIDATE_SECRET }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::notice::Portfolio secrets are not set yet; skipping refresh."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh now
        if: steps.config.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "${SITE_URL%/}/api/revalidate" \
            -H "Content-Type: application/json" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            -d '{"tags":["github-contributions"]}'

      # GitHub can take a minute or two to count a new push, so refresh once more
      # afterwards. Skipped for scheduled runs, which already run every 15 minutes.
      - name: Refresh again after GitHub has counted the push
        if: steps.config.outputs.ready == 'true' && github.event_name != 'schedule'
        run: |
          sleep 120
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "${SITE_URL%/}/api/revalidate" \
            -H "Content-Type: application/json" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            -d '{"tags":["github-contributions"]}'
